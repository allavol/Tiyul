<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171b" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>

    <!-- Glowing Pill -->
    <filter id="glowTealC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="navBtnGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="sentinelBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Outer Glassmorphic Card Container -->
  <rect x="10" y="10" width="400" height="560" rx="24" fill="url(#bgGradC)" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- ── 1. HEADER (Title, Waze CTA, Close X) ── -->
  <!-- Close Button (X) -->
  <circle cx="38" cy="38" r="14" fill="#20232a" stroke="#333842" stroke-width="1" />
  <path d="M 33 33 L 43 43 M 43 33 L 33 43" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" />

  <!-- Waze Navigation CTA Button -->
  <g transform="translate(62, 24)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="url(#navBtnGradC)" filter="url(#glowTealC)" />
    <text x="50" y="18" fill="#022c22" font-size="12" font-weight="900" text-anchor="middle" direction="rtl">🚗 נווט</text>
  </g>

  <!-- Site Title (RTL) -->
  <g transform="translate(390, 30)" text-anchor="end">
    <text x="0" y="10" fill="#ffffff" font-size="16" font-weight="900" direction="rtl">עין פרת (נחל פרת)</text>
  </g>

  <!-- ── 2. UPPER HERO: 3-COLUMN SUITABILITY TRIO ── -->
  <g transform="translate(25, 68)">
    <!-- Tile 1: גיל 4+ -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="120" height="38" rx="10" fill="#1b2220" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1" />
      <text x="60" y="17" fill="#2DD4BF" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">👶 גיל 4+</text>
      <text x="60" y="30" fill="#9ca3af" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">מתאים למשפחות</text>
    </g>

    <!-- Tile 2: עגלות -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="120" height="38" rx="10" fill="#1b2220" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1" />
      <text x="60" y="17" fill="#2DD4BF" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">♿ נגיש לעגלות ✓</text>
      <text x="60" y="30" fill="#9ca3af" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">שביל מרוצף עד המים</text>
    </g>

    <!-- Tile 3: נסיעה -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="38" rx="10" fill="#1b2220" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1" />
      <text x="60" y="17" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">🚗 61 דק' מת"א</text>
      <text x="60" y="30" fill="#9ca3af" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">67 ק"מ • עומס קל</text>
    </g>
  </g>

  <!-- ── 3. 4-DAY MINI WEATHER ROW ── -->
  <g transform="translate(25, 118)">
    <!-- Day 0 (Active) -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="90" height="66" rx="10" fill="#132c27" stroke="#2DD4BF" stroke-width="1.5" />
      <text x="45" y="14" fill="#2DD4BF" font-size="9.5" font-weight="900" text-anchor="middle">היום</text>
      <text x="45" y="34" font-size="15" text-anchor="middle">☀️</text>
      <text x="45" y="52" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">23° - 33°</text>
    </g>

    <!-- Day 1 -->
    <g transform="translate(188, 0)">
      <rect x="0" y="0" width="86" height="66" rx="10" fill="#171a21" stroke="#262b37" stroke-width="1" />
      <text x="43" y="14" fill="#9ca3af" font-size="9.5" font-weight="700" text-anchor="middle">מחר</text>
      <text x="43" y="34" font-size="15" text-anchor="middle">☀️</text>
      <text x="43" y="52" fill="#d1d5db" font-size="11" font-weight="800" text-anchor="middle">24° - 34°</text>
    </g>

    <!-- Day 2 -->
    <g transform="translate(94, 0)">
      <rect x="0" y="0" width="88" height="66" rx="10" fill="#171a21" stroke="#262b37" stroke-width="1" />
      <text x="44" y="14" fill="#9ca3af" font-size="9.5" font-weight="700" text-anchor="middle">שבת</text>
      <text x="44" y="34" font-size="15" text-anchor="middle">🌤️</text>
      <text x="44" y="52" fill="#d1d5db" font-size="11" font-weight="800" text-anchor="middle">23° - 30°</text>
    </g>

    <!-- Day 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="88" height="66" rx="10" fill="#171a21" stroke="#262b37" stroke-width="1" />
      <text x="44" y="14" fill="#9ca3af" font-size="9.5" font-weight="700" text-anchor="middle">יום א׳</text>
      <text x="44" y="34" font-size="15" text-anchor="middle">☀️</text>
      <text x="44" y="52" fill="#d1d5db" font-size="11" font-weight="800" text-anchor="middle">22° - 29°</text>
    </g>
  </g>

  <!-- ── 4. GLOWING SENTINEL ADVICE BANNER ── -->
  <g transform="translate(25, 196)">
    <rect x="0" y="0" width="370" height="42" rx="12" fill="url(#sentinelBannerGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="185" y="26" fill="#ecfdf5" font-size="12" font-weight="900" text-anchor="middle" direction="rtl">
      🛡️ בטוח לטיול בבוקר (23°C) • מומלץ להקדים לפני עומס החום!
    </text>
  </g>

  <!-- ── 5. DIURNAL TEMPERATURE SCRUBBER WITH LIVE LABELS ── -->
  <g transform="translate(25, 250)">
    <rect x="0" y="0" width="370" height="74" rx="14" fill="#14171d" stroke="#242935" stroke-width="1" />
    
    <text x="350" y="18" fill="#2DD4BF" font-size="10" font-weight="800" text-anchor="end" direction="rtl">בוקר התמדיידו (שעות מומלצות)</text>

    <!-- Slider Track -->
    <rect x="25" y="32" width="320" height="6" rx="3" fill="#222733" />
    <!-- Active Slider Fill -->
    <rect x="235" y="32" width="110" height="6" rx="3" fill="#2DD4BF" />
    <!-- Slider Handle -->
    <circle cx="235" cy="35" r="9" fill="#ffffff" stroke="#2DD4BF" stroke-width="3" filter="url(#glowTealC)" />

    <!-- 3 Hourly Temperature Labels -->
    <g transform="translate(0, 52)">
      <text x="345" y="12" fill="#2DD4BF" font-size="10.5" font-weight="900" text-anchor="end" direction="rtl">בוקר 08:00 (23°C)</text>
      <text x="185" y="12" fill="#9ca3af" font-size="10" font-weight="700" text-anchor="middle" direction="rtl">צהריים 14:00 (33°C)</text>
      <text x="25" y="12" fill="#9ca3af" font-size="10" font-weight="700" text-anchor="start" direction="rtl">ערב 19:00 (25°C)</text>
    </g>
  </g>

  <!-- ── 6. BOTTOM 3 TACTILE SPEC TILES ── -->
  <g transform="translate(25, 336)">
    <!-- Tile 1: מים -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="120" height="68" rx="12" fill="#14171d" stroke="#242935" stroke-width="1" />
      <text x="60" y="28" font-size="18" text-anchor="middle">💧</text>
      <text x="60" y="46" fill="#93c5fd" font-size="11" font-weight="800" text-anchor="middle" direction="rtl">מים זורמים</text>
      <text x="60" y="58" fill="#6b7280" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">בריכות שכשוך</text>
    </g>

    <!-- Tile 2: רט"ג -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="120" height="68" rx="12" fill="#14171d" stroke="#242935" stroke-width="1" />
      <text x="60" y="28" font-size="18" text-anchor="middle">🎟️</text>
      <text x="60" y="46" fill="#fcd34d" font-size="11" font-weight="800" text-anchor="middle" direction="rtl">רט"ג בתשלום</text>
      <text x="60" y="58" fill="#6b7280" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">28 ₪ / מנוי חינם</text>
    </g>

    <!-- Tile 3: אורך מסלול -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="68" rx="12" fill="#14171d" stroke="#242935" stroke-width="1" />
      <text x="60" y="28" font-size="18" text-anchor="middle">📏</text>
      <text x="60" y="46" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">2.5 ק"מ</text>
      <text x="60" y="58" fill="#6b7280" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">מסלול מעגלי קל</text>
    </g>
  </g>

  <!-- ── 7. COMPACT SAFETY & LEGAL NOTICE ── -->
  <g transform="translate(25, 416)">
    <rect x="0" y="0" width="370" height="38" rx="8" fill="#451a03" fill-opacity="0.25" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" />
    <text x="355" y="17" fill="#fde68a" font-size="8.5" font-weight="700" text-anchor="end" direction="rtl">⚠️ הנחיית שטח רשמית:</text>
    <text x="355" y="29" fill="#f59e0b" font-size="8" font-weight="500" text-anchor="end" direction="rtl">
      שמורת טבע בתשלום. חובה לשריין מקום באתר רט״ג בסופי שבוע ולוודא אישור ביטחוני.
    </text>
  </g>

  <!-- ── 8. BOTTOM TELEMETRY BAR ── -->
  <g transform="translate(25, 466)">
    <line x1="0" y1="0" x2="370" y2="0" stroke="#20242e" stroke-width="1" />
    <circle cx="10" cy="14" r="3.5" fill="#2DD4BF" />
    <text x="20" y="17" fill="#6b7280" font-size="8.5" font-weight="600">Open-Meteo &amp; Tomorrow.io Diurnal Stream</text>
    <text x="370" y="17" fill="#6b7280" font-size="8.5" font-weight="600" text-anchor="end" direction="rtl">INPA-4011 • מאומת רט״ג</text>
  </g>
</svg>
