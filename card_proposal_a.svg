<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>

    <!-- Card Glow -->
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="wazeBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="safeVerdictGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Outer Glassmorphic Card Container -->
  <rect x="10" y="10" width="400" height="560" rx="24" fill="url(#bgGradA)" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Subtle Top Accent Light -->
  <path d="M 34 10 L 386 10" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- ── 1. HEADER (Title, Region, Waze CTA, Close X) ── -->
  <!-- Close Button (X) -->
  <circle cx="38" cy="38" r="14" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <path d="M 33 33 L 43 43 M 43 33 L 33 43" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" />

  <!-- Waze Navigation CTA Button -->
  <g transform="translate(62, 24)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="url(#wazeBtnGrad)" filter="url(#glowTeal)" />
    <text x="52" y="18" fill="#042f2e" font-size="12" font-weight="900" text-anchor="middle" direction="rtl">🚗 נווט ב-Waze</text>
  </g>

  <!-- Site Title & Region (RTL, right-aligned) -->
  <g transform="translate(390, 28)" text-anchor="end">
    <text x="0" y="10" fill="#ffffff" font-size="15" font-weight="900" direction="rtl">עין פרת (נחל פרת)</text>
    <text x="0" y="25" fill="#2DD4BF" font-size="10" font-weight="700" direction="rtl">מדבר יהודה וים המלח 💧</text>
  </g>

  <!-- ── 2. UPPER HERO: למי מתאים (Suitability Strip) ── -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="370" height="32" rx="10" fill="#132a27" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1" />
    <text x="355" y="20" fill="#99f6e4" font-size="11" font-weight="800" text-anchor="end" direction="rtl">
      למי מתאים: <tspan fill="#ffffff">👶 מגיל 4+</tspan>  |  <tspan fill="#ffffff">♿ נגיש לעגלות ✓</tspan>  |  <tspan fill="#ffffff">⏱️ 61 דק' מת"א</tspan>
    </text>
  </g>

  <!-- ── 3. WEATHER SECTION: 4-Day Compact Grid ── -->
  <g transform="translate(25, 112)">
    <!-- Header -->
    <text x="370" y="10" fill="#a1a1aa" font-size="10" font-weight="800" text-anchor="end" direction="rtl">האם בטוח? • תחזית 4 ימים</text>
    <text x="0" y="10" fill="#2DD4BF" font-size="9.5" font-weight="800" text-anchor="start">היום (15/10)</text>

    <!-- 4 Day Mini Cards -->
    <!-- Day 0: היום (Active) -->
    <g transform="translate(278, 18)">
      <rect x="0" y="0" width="92" height="76" rx="12" fill="#132e2a" stroke="#2DD4BF" stroke-width="1.5" />
      <text x="46" y="14" fill="#2DD4BF" font-size="10" font-weight="800" text-anchor="middle">היום</text>
      <text x="46" y="25" fill="#71717a" font-size="8" text-anchor="middle">15/10</text>
      <text x="46" y="44" font-size="16" text-anchor="middle">☀️</text>
      <text x="46" y="58" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">24°</text>
      <rect x="10" y="62" width="72" height="10" rx="3" fill="#065f46" />
      <text x="46" y="70" fill="#6ee7b7" font-size="7.5" font-weight="800" text-anchor="middle">✓ בטוח</text>
    </g>

    <!-- Day 1: מחר -->
    <g transform="translate(186, 18)">
      <rect x="0" y="0" width="86" height="76" rx="12" fill="#1f1f23" stroke="#27272a" stroke-width="1" />
      <text x="43" y="14" fill="#e4e4e7" font-size="10" font-weight="700" text-anchor="middle">מחר</text>
      <text x="43" y="25" fill="#71717a" font-size="8" text-anchor="middle">16/10</text>
      <text x="43" y="44" font-size="16" text-anchor="middle">☀️</text>
      <text x="43" y="58" fill="#d4d4d8" font-size="11" font-weight="800" text-anchor="middle">26°</text>
      <rect x="10" y="62" width="66" height="10" rx="3" fill="#065f46" />
      <text x="43" y="70" fill="#6ee7b7" font-size="7.5" font-weight="800" text-anchor="middle">✓ בטוח</text>
    </g>

    <!-- Day 2: שבת -->
    <g transform="translate(94, 18)">
      <rect x="0" y="0" width="86" height="76" rx="12" fill="#1f1f23" stroke="#27272a" stroke-width="1" />
      <text x="43" y="14" fill="#e4e4e7" font-size="10" font-weight="700" text-anchor="middle">שבת</text>
      <text x="43" y="25" fill="#71717a" font-size="8" text-anchor="middle">17/10</text>
      <text x="43" y="44" font-size="16" text-anchor="middle">🌤️</text>
      <text x="43" y="58" fill="#d4d4d8" font-size="11" font-weight="800" text-anchor="middle">29°</text>
      <rect x="10" y="62" width="66" height="10" rx="3" fill="#065f46" />
      <text x="43" y="70" fill="#6ee7b7" font-size="7.5" font-weight="800" text-anchor="middle">✓ בטוח</text>
    </g>

    <!-- Day 3: יום א׳ -->
    <g transform="translate(2, 18)">
      <rect x="0" y="0" width="86" height="76" rx="12" fill="#1f1f23" stroke="#27272a" stroke-width="1" />
      <text x="43" y="14" fill="#e4e4e7" font-size="10" font-weight="700" text-anchor="middle">יום א׳</text>
      <text x="43" y="25" fill="#71717a" font-size="8" text-anchor="middle">18/10</text>
      <text x="43" y="44" font-size="16" text-anchor="middle">☀️</text>
      <text x="43" y="58" fill="#d4d4d8" font-size="11" font-weight="800" text-anchor="middle">27°</text>
      <rect x="10" y="62" width="66" height="10" rx="3" fill="#065f46" />
      <text x="43" y="70" fill="#6ee7b7" font-size="7.5" font-weight="800" text-anchor="middle">✓ בטוח</text>
    </g>
  </g>

  <!-- ── 4. DYNAMIC HOURLY SCRUBBER (בוקר / צהריים / ערב) ── -->
  <g transform="translate(25, 222)">
    <rect x="0" y="0" width="370" height="54" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    
    <!-- Time Labels -->
    <text x="350" y="18" fill="#2DD4BF" font-size="10" font-weight="800" text-anchor="end" direction="rtl">בוקר (08:00)</text>
    <text x="185" y="18" fill="#71717a" font-size="10" font-weight="700" text-anchor="middle" direction="rtl">צהריים (14:00)</text>
    <text x="20" y="18" fill="#71717a" font-size="10" font-weight="700" text-anchor="start" direction="rtl">ערב (19:00)</text>

    <!-- Slider Track -->
    <rect x="20" y="30" width="330" height="5" rx="2.5" fill="#27272a" />
    <!-- Active Slider Fill -->
    <rect x="240" y="30" width="110" height="5" rx="2.5" fill="#2DD4BF" />
    <!-- Slider Thumb Button -->
    <circle cx="240" cy="32.5" r="8" fill="#ffffff" stroke="#2DD4BF" stroke-width="2.5" filter="url(#glowTeal)" />
  </g>

  <!-- ── 5. LARGE GLOWING SAFETY STATUS BADGE ── -->
  <g transform="translate(25, 288)">
    <rect x="0" y="0" width="370" height="42" rx="12" fill="url(#safeVerdictGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="185" y="26" fill="#ecfdf5" font-size="13" font-weight="900" text-anchor="middle" direction="rtl">
      🛡️ בטוח לטיול ✓ (24°C בבוקר)
    </text>
  </g>

  <!-- ── 6. COMPACT FEATURE SPEC TILES (מה יש באתר?) ── -->
  <g transform="translate(25, 342)">
    <text x="370" y="10" fill="#a1a1aa" font-size="10" font-weight="800" text-anchor="end" direction="rtl">מה יש באתר? • מפרט מהיר</text>
    
    <!-- 4 Inline Feature Badges -->
    <g transform="translate(0, 18)">
      <!-- Badge 1: מים -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="90" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="45" y="18" fill="#93c5fd" font-size="10" font-weight="800" text-anchor="middle" direction="rtl">💧 מים זורמים</text>
      </g>

      <!-- Badge 2: קניון -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="78" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="39" y="18" fill="#d4d4d8" font-size="10" font-weight="700" text-anchor="middle" direction="rtl">🪨 קניון סלע</text>
      </g>

      <!-- Badge 3: בתשלום -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="92" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="46" y="18" fill="#fcd34d" font-size="10" font-weight="800" text-anchor="middle" direction="rtl">🎟️ רט"ג (28 ₪)</text>
      </g>

      <!-- Badge 4: מרחק -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="88" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="44" y="18" fill="#e4e4e7" font-size="10" font-weight="700" text-anchor="middle" direction="rtl">📏 2.5 ק"מ קל</text>
      </g>
    </g>
  </g>

  <!-- ── 7. VERDICT SUMMARY ── -->
  <g transform="translate(25, 410)">
    <rect x="0" y="0" width="370" height="48" rx="10" fill="#141417" stroke="#27272a" stroke-width="1" />
    <text x="355" y="19" fill="#2DD4BF" font-size="10" font-weight="800" text-anchor="end" direction="rtl">💡 המלצת המערכת למשפחות:</text>
    <text x="355" y="35" fill="#a1a1aa" font-size="9.5" font-weight="500" text-anchor="end" direction="rtl">
      מומלץ להגיע בשעות הבוקר (08:00–11:00). מים צלולים ורדודים, נוח מאוד עם פעוטות.
    </text>
  </g>

  <!-- ── 8. COMPACT LEGAL DISCLAIMER FOOTER ── -->
  <g transform="translate(25, 470)">
    <rect x="0" y="0" width="370" height="36" rx="8" fill="#451a03" fill-opacity="0.25" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="355" y="16" fill="#fde68a" font-size="8.5" font-weight="700" text-anchor="end" direction="rtl">⚠️ אחריות ובטיחות:</text>
    <text x="355" y="27" fill="#d97706" font-size="8" font-weight="500" text-anchor="end" direction="rtl">
      הנתונים מבוססי מודלים. חובה לוודא אישור פתיחה והתרעות שיטפונות באתר רט״ג טרם היציאה.
    </text>
  </g>

  <!-- ── 9. BOTTOM LIVE DATA STATUS BAR ── -->
  <g transform="translate(25, 520)">
    <line x1="0" y1="0" x2="370" y2="0" stroke="#27272a" stroke-width="1" />
    <circle cx="10" cy="14" r="3.5" fill="#2DD4BF" />
    <text x="20" y="17" fill="#71717a" font-size="8.5" font-weight="600">Open-Meteo &amp; Tomorrow.io Live Telemetry</text>
    <text x="370" y="17" fill="#71717a" font-size="8.5" font-weight="600" text-anchor="end" direction="rtl">INPA-4011 • מאומת רשמי</text>
  </g>
</svg>
