<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient (Light Mode) -->
    <linearGradient id="bgGradCLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <linearGradient id="navBtnGradCLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <linearGradient id="sentinelBannerGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
  </defs>

  <!-- Outer Glassmorphic Card Container (Light Mode) -->
  <rect x="10" y="10" width="400" height="560" rx="24" fill="url(#bgGradCLight)" stroke="#0d9488" stroke-opacity="0.3" stroke-width="1.5" filter="url(#cardShadowLight)" />

  <!-- ── 1. HEADER (Title, Waze CTA, Close X) ── -->
  <!-- Close Button (X) -->
  <circle cx="38" cy="38" r="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <path d="M 33 33 L 43 43 M 43 33 L 33 43" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Waze Navigation CTA Button -->
  <g transform="translate(62, 24)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="url(#navBtnGradCLight)" />
    <text x="50" y="18" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle" direction="rtl">🚗 נווט</text>
  </g>

  <!-- Site Title (RTL) -->
  <g transform="translate(390, 30)" text-anchor="end">
    <text x="0" y="10" fill="#0f172a" font-size="16" font-weight="900" direction="rtl">עין פרת (נחל פרת)</text>
    <text x="0" y="24" fill="#0d9488" font-size="10" font-weight="700" direction="rtl">מדבר יהודה וים המלח 💧</text>
  </g>

  <!-- ── 2. UPPER HERO: 3-COLUMN SUITABILITY TRIO (Light Mode) ── -->
  <g transform="translate(25, 68)">
    <!-- Tile 1: גיל 4+ -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="120" height="38" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-opacity="0.4" stroke-width="1" />
      <text x="60" y="17" fill="#0f766e" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">👶 גיל 4+</text>
      <text x="60" y="30" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">מתאים למשפחות</text>
    </g>

    <!-- Tile 2: עגלות -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="120" height="38" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-opacity="0.4" stroke-width="1" />
      <text x="60" y="17" fill="#0f766e" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">♿ נגיש לעגלות ✓</text>
      <text x="60" y="30" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">שביל מרוצף עד המים</text>
    </g>

    <!-- Tile 3: נסיעה -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="38" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="60" y="17" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">🚗 61 דק' מת"א</text>
      <text x="60" y="30" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">67 ק"מ • עומס קל</text>
    </g>
  </g>

  <!-- ── 3. 4-DAY MINI WEATHER ROW (Light Mode) ── -->
  <g transform="translate(25, 118)">
    <!-- Day 0 (Active) -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="90" height="66" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" />
      <text x="45" y="14" fill="#0f766e" font-size="9.5" font-weight="900" text-anchor="middle">היום</text>
      <text x="45" y="34" font-size="15" text-anchor="middle">☀️</text>
      <text x="45" y="52" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">23° - 33°</text>
    </g>

    <!-- Day 1 -->
    <g transform="translate(188, 0)">
      <rect x="0" y="0" width="86" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="43" y="14" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">מחר</text>
      <text x="43" y="34" font-size="15" text-anchor="middle">☀️</text>
      <text x="43" y="52" fill="#334155" font-size="11" font-weight="800" text-anchor="middle">24° - 34°</text>
    </g>

    <!-- Day 2 -->
    <g transform="translate(94, 0)">
      <rect x="0" y="0" width="88" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="44" y="14" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">שבת</text>
      <text x="44" y="34" font-size="15" text-anchor="middle">🌤️</text>
      <text x="44" y="52" fill="#334155" font-size="11" font-weight="800" text-anchor="middle">23° - 30°</text>
    </g>

    <!-- Day 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="88" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="44" y="14" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">יום א׳</text>
      <text x="44" y="34" font-size="15" text-anchor="middle">☀️</text>
      <text x="44" y="52" fill="#334155" font-size="11" font-weight="800" text-anchor="middle">22° - 29°</text>
    </g>
  </g>

  <!-- ── 4. GLOWING SENTINEL ADVICE BANNER (Light Mode) ── -->
  <g transform="translate(25, 196)">
    <rect x="0" y="0" width="370" height="42" rx="12" fill="url(#sentinelBannerGradLight)" stroke="#059669" stroke-width="1.2" />
    <text x="185" y="26" fill="#065f46" font-size="12" font-weight="900" text-anchor="middle" direction="rtl">
      🛡️ בטוח לטיול בבוקר (23°C) • מומלץ להקדים לפני עומס החום!
    </text>
  </g>

  <!-- ── 5. DIURNAL TEMPERATURE SCRUBBER (Light Mode) ── -->
  <g transform="translate(25, 250)">
    <rect x="0" y="0" width="370" height="74" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="350" y="18" fill="#0f766e" font-size="10" font-weight="800" text-anchor="end" direction="rtl">שעות מומלצות לטיול משפחתי</text>

    <!-- Slider Track -->
    <rect x="25" y="32" width="320" height="6" rx="3" fill="#e2e8f0" />
    <!-- Active Slider Fill -->
    <rect x="235" y="32" width="110" height="6" rx="3" fill="#0d9488" />
    <!-- Slider Handle -->
    <circle cx="235" cy="35" r="9" fill="#ffffff" stroke="#0d9488" stroke-width="3" />

    <!-- 3 Hourly Temperature Labels -->
    <g transform="translate(0, 52)">
      <text x="345" y="12" fill="#0f766e" font-size="10.5" font-weight="900" text-anchor="end" direction="rtl">בוקר 08:00 (23°C)</text>
      <text x="185" y="12" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" direction="rtl">צהריים 14:00 (33°C)</text>
      <text x="25" y="12" fill="#64748b" font-size="10" font-weight="700" text-anchor="start" direction="rtl">ערב 19:00 (25°C)</text>
    </g>
  </g>

  <!-- ── 6. BOTTOM 3 TACTILE SPEC TILES (Light Mode) ── -->
  <g transform="translate(25, 336)">
    <!-- Tile 1: מים -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="120" height="68" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
      <text x="60" y="28" font-size="18" text-anchor="middle">💧</text>
      <text x="60" y="46" fill="#0369a1" font-size="11" font-weight="800" text-anchor="middle" direction="rtl">מים זורמים</text>
      <text x="60" y="58" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">בריכות שכשוך</text>
    </g>

    <!-- Tile 2: רט"ג -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="120" height="68" rx="12" fill="#fefce8" stroke="#fef08a" stroke-width="1" />
      <text x="60" y="28" font-size="18" text-anchor="middle">🎟️</text>
      <text x="60" y="46" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle" direction="rtl">רט"ג בתשלום</text>
      <text x="60" y="58" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">28 ₪ / מנוי חינם</text>
    </g>

    <!-- Tile 3: אורך מסלול -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="68" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="60" y="28" font-size="18" text-anchor="middle">📏</text>
      <text x="60" y="46" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle" direction="rtl">2.5 ק"מ</text>
      <text x="60" y="58" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle" direction="rtl">מסלול מעגלי קל</text>
    </g>
  </g>

  <!-- ── 7. COMPACT SAFETY & LEGAL NOTICE (Light Mode) ── -->
  <g transform="translate(25, 416)">
    <rect x="0" y="0" width="370" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
    <text x="355" y="17" fill="#92400e" font-size="8.5" font-weight="700" text-anchor="end" direction="rtl">⚠️ הנחיית שטח רשמית:</text>
    <text x="355" y="29" fill="#b45309" font-size="8" font-weight="600" text-anchor="end" direction="rtl">
      שמורת טבע בתשלום. חובה לשריין מקום באתר רט״ג בסופי שבוע ולוודא אישור ביטחוני.
    </text>
  </g>

  <!-- ── 8. BOTTOM TELEMETRY BAR (Light Mode) ── -->
  <g transform="translate(25, 466)">
    <line x1="0" y1="0" x2="370" y2="0" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="10" cy="14" r="3.5" fill="#0d9488" />
    <text x="20" y="17" fill="#94a3b8" font-size="8.5" font-weight="600">Open-Meteo &amp; Tomorrow.io Diurnal Stream</text>
    <text x="370" y="17" fill="#94a3b8" font-size="8.5" font-weight="600" text-anchor="end" direction="rtl">INPA-4011 • מאומת רט״ג</text>
  </g>
</svg>
